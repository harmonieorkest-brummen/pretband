name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  ci:
    uses: ImreBoersma/projects/.github/workflows/ci-node.yml@main
    with: { artifact: dist }
    secrets:
      build-env: |
        VITE_GTM_TAG_ID=${{ secrets.VITE_GTM_TAG_ID }}
        VITE_INSTAGRAM_URL=${{ secrets.VITE_INSTAGRAM_URL }}
        VITE_TIKTOK_URL=${{ secrets.VITE_TIKTOK_URL }}
        VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://pretband.nl' }}
        VITE_BASIN_FORM_ID=${{ secrets.VITE_BASIN_FORM_ID }}
        VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
  deploy:
    needs: ci
    permissions: { pages: write, id-token: write }
    uses: ImreBoersma/projects/.github/workflows/deploy-pages.yml@main
